<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href ="./css/style.css">
</head>
<body>
   <h1 class="text-center mt-4">What Vacation Spot Are You?</h1>

  <!-- Start quiz element -->
<div class="container d-flex justify-content-center" id="question-1">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">What's your ideal morning on vacation?</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="beach">Sleeping in, then lounging by the water</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="city">Grabbing coffee and exploring the streets</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cabin">Sipping coffee on the porch at sunrise</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="themepark">Getting up early to beat the lines for the rides</button>
      </div>
    </div>
  </div>
</div>
<!-- End quiz element -->

<!-- Start quiz element -->
<div class="container d-flex justify-content-center" id="question-2">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">How much do you like having a plan?</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="city">A full schedule so I can see and do everything</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="beach">No plan at all, I’ll go wherever the day takes me</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cabin">A loose plan with plenty of downtime to relax</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="themepark">A must-do list with the big attractions first</button>
      </div>
    </div>
  </div>
</div>
<!-- End quiz element -->

<!-- Start quiz element -->
<div class="container d-flex justify-content-center" id="question-3">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">Who would you most like to travel with?</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cabin">Just me, I like the quiet</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="beach">My partner or best friend, somewhere relaxing</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="themepark">A big group of friends or family</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="city">Someone who loves trying new places and foods</button>
      </div>
    </div>
  </div>
</div>
<!-- End quiz element -->

<!-- Start quiz element -->
<div class="container d-flex justify-content-center" id="question-4">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">What souvenir would you bring home?</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="city">A cool shirt or a local treat from a little shop</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="themepark">A plush toy or a photo from the best part of the trip</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="beach">A seashell or a souvenir tan</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cabin">A carved wooden piece or a good book</button>
      </div>
    </div>
  </div>
</div>
<!-- End quiz element -->

    <!-- Add more quiz elements here -->



    <div class="container d-flex justify-content-center">
      <button id="show-result" class="btn btn-success my-4">Show Results</button>
    </div>    
    <!-- Output the result here -->
    <div class="container d-flex justify-content-center">
      <div id="result-container" class="card p-4 mb-4" style="width: 75%; display: none;">
        <h3>Your Result:</h3>
        <p id="result-text"></p>
      </div>
    </div>
    
    <!-- Connect to your script file here -->
     <script src = "./js/script.js"></script>


    </body>
</html>
